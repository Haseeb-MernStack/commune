# Render Blueprint for the Commune API.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: commune-api
    runtime: node
    plan: free
    # --include=dev because Render sets NODE_ENV=production, which would otherwise skip the
    # build tools (tsup, typescript) needed to compile the API.
    buildCommand: npm install --include=dev && npm run build -w @commune/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Vercel rewrite -> Render = two proxies in front of the API.
      - key: TRUST_PROXY
        value: 2
      # Generated once by Render and kept secret.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # You fill these in on the Render dashboard (never commit them):
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

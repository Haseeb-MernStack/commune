# Render Blueprint for the Commune realtime (Socket.IO) service.
# The web app and the API run on Vercel; only this always-on service needs a server, because
# serverless functions cannot hold WebSocket connections. See docs/REALTIME.md.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: commune-realtime
    runtime: node
    # The free plan sleeps after idle time, which drops every connection and delays the next one.
    # Use a paid plan for real users (the app falls back to polling while the service is asleep).
    plan: starter
    # --include=dev because Render sets NODE_ENV=production, which would skip the build tools.
    buildCommand: npm install --include=dev && npm run build -w @commune/realtime
    startCommand: node apps/realtime/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Fill these in on the Render dashboard (never commit them):
      - key: JWT_ACCESS_SECRET # exactly the same value as on the API project
        sync: false
      - key: REALTIME_SECRET # new random value, the same on the API project
        sync: false
      - key: CLIENT_ORIGIN # https://commune-mu.vercel.app (no trailing slash)
        sync: false
      - key: API_URL # https://commune-8im5.vercel.app
        sync: false

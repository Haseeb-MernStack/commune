name: Scorecard

# OpenSSF Scorecard grades the repository's security habits (branch protection, dependency updates, pinned
# workflows, code review...) and publishes a public badge. Results appear under Security → Code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: "30 2 * * 1" # Mondays
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish the public score
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

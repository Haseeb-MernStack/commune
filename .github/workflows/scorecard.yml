name: Scorecard

# OpenSSF Scorecard grades the repository's security habits (branch protection, dependency updates, pinned
# workflows, code review...) and publishes a public badge. Results appear under Security → Code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: "30 2 * * 1" # Mondays
  push:
    branches: [main]

# v2.4.3 pulls its image from GitHub Container Registry. v2.4.0 used gcr.io, which now fails with a billing error.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload results to code scanning
      id-token: write # publish the public score
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          sarif_file: results.sarif
